server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # скрытые файлы (.env, .git и т.д.) — на случай, если окажутся внутри public/
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Статика тем и общего ядра (css/js/manifest.json) отдаётся напрямую,
    # без прохождения через PHP — try_files ниже уже это обеспечивает,
    # так как файлы физически существуют на диске.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
